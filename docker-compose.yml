services:
  opencode:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
    image: local/opencode:${OPENCODE_VERSION:-latest}
    # Alternativa: usar la imagen publicada por el workflow (quitar "build:")
    # image: ghcr.io/<owner>/opencode:2.3.2
    container_name: opencode
    restart: unless-stopped
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Define OPENCODE_SERVER_PASSWORD en .env}
    volumes:
      - ./data/config:/home/opencode/.config/opencode
      - ./data/share:/home/opencode/.local/share/opencode
      - ./data/state:/home/opencode/.local/state/opencode
      - ${WORKSPACE_PATH:-./workspace}:/workspace
